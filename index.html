<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <!-- iOS exige PNG para el icono de "Añadir a inicio"; el SVG no le sirve. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <!-- PWA instalable: en iPhone (Safari → Compartir → Añadir a pantalla de
         inicio) abre a pantalla completa sin el chrome del navegador. La barra
         de estado "black" empalma con el fondo #070708 de la app. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="FinTrack" />
    <title>FinTrack — Presupuesto y Control de Gastos</title>
    <meta name="description" content="FinTrack es una aplicación privada para el seguimiento y control de presupuesto, gastos, tarjetas de crédito y metas de ahorro." />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope (display/headlines) · Inter (body/data/labels). Solo los pesos
         que el código usa de verdad (400/500/600/700 Inter, 600/700 Manrope);
         JetBrains Mono se eliminó: ningún token la referenciaba. -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols (iconos de toda la UI). Antes se inyectaba desde JS
         tras montar React; aquí el fetch arranca en paralelo con el bundle y
         los iconos aparecen antes. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <!-- Los PNG de emojis (JoyPixels) se sirven desde jsDelivr en cada pantalla. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
